services:
  postgres:
    image: postgres:16
    container_name: event-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: event_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - event_pgdata:/var/lib/postgresql/data

volumes:
  event_pgdata: