spring.application.name=notification-service

server.port=8083

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=ro.eusebiu.notification_service.kafka.event
spring.kafka.consumer.properties.spring.json.value.default.type=ro.eusebiu.notification_service.kafka.event.OrderCreatedEvent

spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Email configuration
# Local SMTP - Mailpit
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}

spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/notification_service
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
